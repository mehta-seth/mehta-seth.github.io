:root {
  --ink: #1a1814;
  --ink-soft: #4a443b;
  --accent: #7d5127;
  --paper: #faf8f3;
  --accent-sky: #5a3818;
  --serif: 'Newsreader', 'Charter', 'Georgia', serif;
  --edge: max(1.5rem, calc((100vw - 80rem) / 2 + 1.5rem));
  --measure: 25rem;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: linear-gradient(#3f74bb 0%, #9fbfe0 58%, #c3d2de 62%, #556b38 62.2%, #2a381c 100%);
  color: var(--ink);
  font-family: var(--serif);
  font-kerning: normal;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.shot *, .shot *::before, .shot *::after { transition: none !important; }

/* The landing frame's name, kicker and title, set straight on the clear sky. Leaving the landing, they evaporate. */
.masthead {
  position: fixed; top: 0; left: 0; z-index: 2;
  padding: calc(2.25rem + env(safe-area-inset-top, 0px)) 1.5rem 0 var(--edge);
}
.wordmark {
  font-family: 'Newsreader', 'Kalam', serif;
  font-weight: 400;
  font-size: clamp(1.375rem, 1.25rem + 0.3vw, 1.5rem);
  line-height: 1.3;
  color: var(--ink);
  text-decoration: none;
  display: inline-block;
}
.wordmark:hover, .wordmark:focus-visible { color: var(--accent); }
.wordmark .latin { font-weight: 600; }
.wordmark .devanagari { font-family: 'Kalam', 'Noto Sans Devanagari', sans-serif; font-weight: 400; font-size: 0.92em; }
.wordmark .dot { margin: 0 0.35em; opacity: 0.6; }
.kicker {
  margin: 2.4rem 0 0;
  font-family: 'HML Script', cursive;
  color: var(--accent-sky);
  font-size: clamp(1.75rem, 1.45rem + 1.1vw, 2.4rem);
  line-height: 1;
}
.title {
  margin: 0.25rem 0 0;
  font-weight: 600;
  font-size: clamp(3rem, 2.1rem + 3vw, 4.8rem);
  line-height: 1;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.masthead .wordmark, .masthead .kicker, .masthead .title {
  transition: opacity 1.2s cubic-bezier(.4, 0, .2, 1), filter 1.2s cubic-bezier(.4, 0, .2, 1),
              transform 1.7s cubic-bezier(.2, .6, .2, 1), letter-spacing 1.7s ease;
}
/* Horizontal swipes belong to the page (next or previous cloud); vertical panning and pinch-zoom stay with the browser. */
html { touch-action: pan-y pinch-zoom; }
.masthead.is-gone { pointer-events: none; }
.masthead.is-gone .wordmark { opacity: 0; filter: blur(8px); transform: translate(8px, -10px); }
.masthead.is-gone .kicker { opacity: 0; filter: blur(9px); transform: translate(12px, -14px); transition-delay: 0.1s; }
.masthead.is-gone .title { opacity: 0; filter: blur(12px); transform: translate(16px, -20px); letter-spacing: 0.06em; transition-delay: 0.2s; }

/* The caption: light ink on the shaded turf in front of you. */
.shade {
  position: fixed; left: 0; right: 0; bottom: 0; height: max(50%, calc(var(--panel-h, 0px) + 24vh)); z-index: 1; pointer-events: none;
  background: linear-gradient(to top, rgba(7, 10, 6, 0.74) 0%, rgba(7, 10, 6, 0.5) 34%, rgba(7, 10, 6, 0.16) 68%, rgba(7, 10, 6, 0) 100%);
}
.panel {
  position: fixed; left: var(--edge); bottom: calc(2.1rem + env(safe-area-inset-bottom, 0px)); z-index: 2;
  max-width: calc(100vw - 2 * var(--edge));
  --ink: #f4f0e7; --ink-soft: #cdc5b3; --accent: #e6bb88;
  color: var(--ink);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 0 20px rgba(0, 0, 0, 0.35);
}
.panel .nav button { border-bottom-color: rgba(244, 240, 231, 0.35); }
.panel .nav .next { border-bottom-color: rgba(230, 187, 136, 0.6); }

.panel__grid { display: grid; grid-template-columns: minmax(0, var(--measure)); }
.panel__body { transition: opacity 320ms ease, filter 320ms ease; }
.panel__body.is-fading { opacity: 0; filter: blur(6px); }

.lead { margin: 0; max-width: 25rem; text-wrap: balance; font-size: clamp(1.25rem, 1.12rem + 0.5vw, 1.5rem); line-height: 1.42; text-wrap: pretty; }
.name {
  margin: 0;
  font-weight: 400; font-style: italic;
  font-size: clamp(3rem, 2.2rem + 2.6vw, 4.6rem);
  line-height: 0.95;
  letter-spacing: -0.02em;
}
.name abbr {
  font-style: normal; font-size: 0.3em; letter-spacing: 0.05em;
  color: var(--ink-soft); text-decoration: none;
  margin-left: 0.5em; vertical-align: 0.62em;
}
.root { margin: 0.65rem 0 0; font-size: 1.0625rem; color: var(--ink-soft); text-wrap: balance; }
.level { display: none; margin: 0.2rem 0 0; font-size: 0.9375rem; color: var(--accent); }
.look { margin: 0.9rem 0 0; font-size: clamp(1.125rem, 1.05rem + 0.3vw, 1.3125rem); line-height: 1.48; text-wrap: balance; }
.tell { margin: 0.55rem 0 0; font-size: 1.0625rem; line-height: 1.45; font-style: italic; color: var(--ink-soft); text-wrap: balance; }
.heading { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(2.3rem, 1.8rem + 1.8vw, 3.3rem); line-height: 1; letter-spacing: -0.015em; }
.names { margin: 1rem 0 0; border-collapse: collapse; font-size: 1rem; line-height: 1.35; }
.names th { font-weight: 400; font-style: italic; color: var(--ink-soft); text-align: left; padding: 0.2rem 1.25rem 0.2rem 0; vertical-align: top; }
.names td { padding: 0.2rem 1.25rem 0.2rem 0; vertical-align: top; }
.names thead th { padding-bottom: 0.45rem; }

/* Where the cloud lives: the WMO levels for the middle latitudes, 0 to 13 km. */
.gauge {
  position: fixed; right: var(--edge); top: 19vh; height: 40vh; width: 7.5rem; z-index: 2; pointer-events: none;
  font-size: 0.875rem; color: #2d2924;
  filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
  transition: opacity 400ms ease;
}
.gauge.is-hidden { opacity: 0; }
.panel.no-gauge .panel__grid { grid-template-columns: minmax(0, var(--measure)); }
.panel.no-gauge .gauge { display: none; }
.gauge__line { position: absolute; left: 0.2rem; width: 0; border-left: 1px solid rgba(26, 24, 20, 0.38); }
.gauge__line--mid { left: 0.55rem; }
.gauge__line::before, .gauge__line::after { content: ''; position: absolute; left: -1px; width: 5px; border-top: 1px solid rgba(26, 24, 20, 0.38); }
.gauge__line::before { top: 0; }
.gauge__line::after { bottom: 0; }
.gauge__span {
  position: absolute; left: 1rem; width: 4px; border-radius: 2px; background: var(--accent);
  transition: bottom 900ms cubic-bezier(.4, 0, .2, 1), height 900ms cubic-bezier(.4, 0, .2, 1);
}
.gauge__label { position: absolute; left: 1.65rem; transform: translateY(50%); white-space: nowrap; transition: color 400ms ease; }
.gauge__label.is-on { color: var(--accent); }
.gauge__km { position: absolute; right: 0; transform: translateY(50%); font-size: 0.75rem; font-variant-numeric: lining-nums tabular-nums; opacity: 0.85; }

.nav { display: flex; align-items: baseline; gap: 1.5rem; margin-top: 1.4rem; font-size: 1.0625rem; max-width: var(--measure); }
.nav button {
  font: inherit; color: var(--ink); background: none; border: 0; padding: 0.3rem 0; cursor: pointer;
  border-bottom: 1px solid rgba(26, 24, 20, 0.3);
}
.nav button:hover { border-bottom-color: var(--ink); }
.nav .next { color: var(--accent); border-bottom-color: rgba(125, 81, 39, 0.5); }
.nav .next:hover { border-bottom-color: var(--accent); }
.nav button[hidden] { display: none; }
.nav .count { margin-left: auto; color: var(--ink-soft); font-variant-numeric: lining-nums tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.fallback-note { display: none; }
.no-webgl .fallback-note { display: block; margin: 0.6rem 0 0; color: var(--ink-soft); font-size: 0.9375rem; }
.noui .masthead, .noui .panel, .noui .shade, .noui .gauge, .ogui .panel, .ogui .shade, .ogui .gauge { display: none; }

/* Typography: one display face for names, one reading face, a mono for data. */
:root { --display: 'Instrument Serif', 'Newsreader', Georgia, serif; --text: 'Inter', system-ui, -apple-system, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.panel { font-family: var(--text); --accent: #f0c37a; text-shadow: 0 1px 14px rgba(8, 12, 8, 0.4); }
.lead { font-family: var(--text); font-size: clamp(1.0625rem, 1rem + 0.35vw, 1.3rem); line-height: 1.5; max-width: 25rem; letter-spacing: -0.005em; }
.name { font-family: var(--display); font-style: normal; font-weight: 400; font-size: clamp(1.9rem, 1.5rem + 1vw, 2.6rem); line-height: 1; letter-spacing: 0; }
.name abbr { font-family: var(--mono); font-style: normal; font-size: 0.34em; vertical-align: 0.55em; margin-left: 0.7em; letter-spacing: 0.06em; }
.root { font-family: var(--display); font-size: 1.1875rem; margin: 0.3rem 0 0; color: var(--ink-soft); }
.root i { font-style: italic; color: var(--ink); }
.look { font-family: var(--text); font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem); line-height: 1.55; margin: 0.9rem 0 0; letter-spacing: -0.005em; }
.tell { font-family: var(--text); font-style: normal; font-size: 0.9375rem; line-height: 1.5; margin: 0.35rem 0 0; color: var(--ink-soft); }
.heading { font-family: var(--display); font-style: normal; font-size: clamp(1.9rem, 1.5rem + 1vw, 2.6rem); }
.nav { font-family: var(--text); font-size: 0.9375rem; }
.nav .count { font-family: var(--mono); font-size: 0.8125rem; letter-spacing: 0.05em; }
.gauge { font-family: var(--text); }
.gauge__km { font-family: var(--mono); }

@media (max-height: 760px) and (min-width: 701px) {
  .masthead { padding-top: calc(1.6rem + env(safe-area-inset-top, 0px)); }
  .kicker { margin-top: 1.6rem; }
  .gauge { height: 36vh; }
  .nav { margin-top: 1.1rem; }
}
@media (max-width: 700px) {
  .masthead { padding: calc(1.4rem + env(safe-area-inset-top, 0px)) 1.25rem 0 1.25rem; }
  .kicker { margin-top: 1.4rem; }
  .panel { left: 1.25rem; right: 1.25rem; bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px)); max-width: none; }
  .shade { height: 64%; }
  .panel__grid { grid-template-columns: minmax(0, 1fr); }
  .gauge { display: none; }
  .level { display: block; }
  .nav { margin-top: 1rem; gap: 1.25rem; }
}
@media (max-width: 479px) {
  .wordmark { display: flex; flex-direction: column; gap: 0.1em; }
  .wordmark .dot { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .masthead .wordmark, .masthead .kicker, .masthead .title { transition: opacity 400ms ease; filter: none !important; transform: none !important; }
  .panel__body, .gauge, .gauge__span, .gauge__label { transition: none; }
}

    lead: 'There are ten kinds of cloud. Each name says what the cloud looks like and how high it sits.' },
  { id: 'cumulus', scene: 'cumulus', name: 'Cumulus', abbr: 'Cu', span: [0.8, 2.6], band: 'low',

  { id: 'stratus', scene: 'stratus', name: 'Stratus', abbr: 'St', span: [0.1, 0.9], band: 'low',

const NOISE_FRAG = /* glsl */`
precision highp float;
precision highp int;
uniform float uSlice;
uniform int uMode;
in vec2 vUv;
out vec4 fragColor;
vec3 hash33(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float worley(vec3 p, float freq) {
  vec3 q = p * freq;
  vec3 id = floor(q);
  vec3 f = q - id;
  float md = 1.0e4;
  for (int x = -1; x <= 1; x++)
  for (int y = -1; y <= 1; y++)
  for (int z = -1; z <= 1; z++) {
    vec3 o = vec3(float(x), float(y), float(z));
    vec3 c = mod(id + o, vec3(freq));
    vec3 r = o + hash33(c) - f;
    md = min(md, dot(r, r));
  }
  return 1.0 - clamp(sqrt(md), 0.0, 1.0);
}
float worleyFbm(vec3 p, float freq) {
  return worley(p, freq) * 0.625 + worley(p, freq * 2.0) * 0.25 + worley(p, freq * 4.0) * 0.125;
}
vec3 grad3(vec3 c) { return normalize(hash33(c + 17.0) * 2.0 - 1.0 + 1e-4); }
float gnoise(vec3 p, float freq) {
  vec3 q = p * freq;
  vec3 i = floor(q);
  vec3 f = q - i;
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec3 P = vec3(freq);
  float n000 = dot(grad3(mod(i, P)), f);
  float n100 = dot(grad3(mod(i + vec3(1.0, 0.0, 0.0), P)), f - vec3(1.0, 0.0, 0.0));
  float n010 = dot(grad3(mod(i + vec3(0.0, 1.0, 0.0), P)), f - vec3(0.0, 1.0, 0.0));
  float n110 = dot(grad3(mod(i + vec3(1.0, 1.0, 0.0), P)), f - vec3(1.0, 1.0, 0.0));
  float n001 = dot(grad3(mod(i + vec3(0.0, 0.0, 1.0), P)), f - vec3(0.0, 0.0, 1.0));
  float n101 = dot(grad3(mod(i + vec3(1.0, 0.0, 1.0), P)), f - vec3(1.0, 0.0, 1.0));
  float n011 = dot(grad3(mod(i + vec3(0.0, 1.0, 1.0), P)), f - vec3(0.0, 1.0, 1.0));
  float n111 = dot(grad3(mod(i + vec3(1.0, 1.0, 1.0), P)), f - vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
             mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
}
float perlinFbm(vec3 p, float freq, int oct) {
  float a = 1.0, s = 0.0, n = 0.0;
  for (int k = 0; k < 8; k++) {
    if (k >= oct) break;
    s += a * gnoise(p, freq);
    n += a;
    a *= 0.5;
    freq *= 2.0;
  }
  return s / n;
}
float remap(float v, float a, float b, float c, float d) { return c + (v - a) * (d - c) / (b - a); }
float equalise(float b) {
  if (b < 0.799) return 0.05 * clamp((b - 0.645) / 0.154, 0.0, 1.0);
  if (b < 0.879) return mix(0.05, 0.25, (b - 0.799) / 0.080);
  if (b < 0.931) return mix(0.25, 0.50, (b - 0.879) / 0.052);
  if (b < 0.968) return mix(0.50, 0.75, (b - 0.931) / 0.037);
  if (b < 0.993) return mix(0.75, 0.95, (b - 0.968) / 0.025);
  return mix(0.95, 1.0, clamp((b - 0.993) / 0.007, 0.0, 1.0));
}
void main() {
  vec3 p = vec3(vUv, uSlice);
  if (uMode == 0) {
    float pf = clamp(perlinFbm(p, 4.0, 5) * 1.4 + 0.5, 0.0, 1.0);
    pf = abs(pf * 2.0 - 1.0);
    pf = 1.0 - pf;
    float w1 = worleyFbm(p, 4.0);
    float w2 = worleyFbm(p, 8.0);
    float w3 = worleyFbm(p, 16.0);
    float pw = clamp(remap(pf, 0.0, 1.0, w1, 1.0), 0.0, 1.0);
    float wf = w1 * 0.625 + w2 * 0.25 + w3 * 0.125;
    fragColor = vec4(equalise(clamp(remap(pw, wf - 1.0, 1.0, 0.0, 1.0), 0.0, 1.0)), w1, w2, w3);
  } else {
    fragColor = vec4(worleyFbm(p, 2.0), worleyFbm(p, 4.0), worleyFbm(p, 8.0), 1.0);
  }
}`;

const MAP_FRAG = /* glsl */`
precision highp float;
uniform float uCells;
uniform float uCov;
uniform vec2 uRad;
uniform vec2 uHgt;
uniform float uSeed;
uniform vec4 uHero;
uniform float uTile;
in vec2 vUv;
out vec4 fragColor;
vec4 hash42(vec2 p) {
  vec4 p4 = fract(vec4(p.xyxy) * vec4(0.1031, 0.1030, 0.0973, 0.1099));
  p4 += dot(p4, p4.wzxy + 33.33);
  return fract((p4.xxyz + p4.yzzw) * p4.zywx);
}
void main() {
  vec2 g = vUv * uCells;
  vec2 gi = floor(g);
  float top = 0.0, nearest = 9.0;
  for (int j = -2; j <= 2; j++)
  for (int i = -2; i <= 2; i++) {
    vec2 cell = gi + vec2(float(i), float(j));
    vec2 id = mod(cell, uCells);
    vec4 r = hash42(id + uSeed);
    if (r.z > uCov) continue;
    vec4 r2 = hash42(id * 1.37 + uSeed + 71.7);
    vec2 c = cell + 0.15 + 0.7 * r.xy;
    float nd = length(g - c) / mix(uRad.x, uRad.y, r2.x);
    nearest = min(nearest, nd);
    top = max(top, mix(uHgt.x, uHgt.y, r2.y * r2.y) * pow(max(0.0, 1.0 - nd * nd), 0.75));
  }
  if (uHero.z > 0.0) {
    vec2 q = vUv * uTile - uHero.xy;
    q -= uTile * floor(q / uTile + 0.5);
    float nd = length(q) / uHero.z;
    nearest = min(nearest, nd);
    top = max(top, uHero.w * pow(max(0.0, 1.0 - nd * nd), 0.75));
  }
  fragColor = vec4(top, min(nearest, 2.0) * 0.5, 0.0, 1.0);
}`;

const FIELD_GLSL = /* glsl */`
uniform mediump sampler3D uShape;
uniform mediump sampler3D uDetail;
uniform int uType;
uniform float uForm;
uniform vec3 uWind;
uniform float uTime;
uniform vec4 uL;
uniform vec4 uN;
uniform vec4 uX;
uniform vec2 uB;
uniform vec3 uSunDir;
uniform float uSigma;
uniform highp sampler2D uMap;
uniform float uMapTile;

const float RE = 6371.0;
float sat(float x) { return clamp(x, 0.0, 1.0); }
float remap(float v, float a, float b, float c, float d) { return c + (v - a) * (d - c) / (b - a); }
float alt(vec3 p) { return p.y + dot(p.xz, p.xz) * (0.5 / RE); }
float pwN(vec3 q) { return texture(uShape, q).r; }
float dtN(vec3 q) {
  vec3 n = texture(uDetail, q).rgb;
  return n.r * 0.625 + n.g * 0.25 + n.b * 0.125;
}
vec2 rot(vec2 v, float a) { float c = cos(a), s = sin(a); return vec2(c * v.x + s * v.y, -s * v.x + c * v.y); }

/* 0 cumulus and 3 stratocumulus: heaps from a map of individual clouds. The map gives each point the
   top of the domes standing on it; billows break up the surface, more toward the top; bases stay flat. */
float dHeaps(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  vec3 w = p + uWind;
  vec4 m = texture(uMap, w.xz / uMapTile);
  float nd = m.g * 2.0;
  if (nd > 1.3) return 0.0;
  float y = (h - h0) / (h1 - h0);
  float near = 1.0 - smoothstep(0.85, 1.25, nd);
  float b = pwN(vec3(w.x, h * 1.15 - uTime * 0.0012, w.z) / uN.x);
  float b2 = hi ? pwN(vec3(w.x, h * 1.4 + uTime * 0.0008, w.z) / (uN.x * 0.4) + 0.31) : 0.5;
  float bump = ((b - 0.5) + (b2 - 0.5) * 0.5) * uX.x * near * (0.6 + 0.4 * y);
  float shoulder = 0.14 * (1.0 - smoothstep(0.0, 0.14, y)) * (1.0 - smoothstep(0.0, 0.45, m.r));
  float surface = m.r * mix(0.25, 1.0, uForm) + bump - y - shoulder - (1.0 - uForm) * 0.3;
  float d = sat(surface * uX.y) * smoothstep(0.0, 0.025, y) * near;
  if (d <= 0.0) return 0.0;
  if (hi) {
    float det = dtN(vec3(w.x, h, w.z) / uN.y + vec3(0.0, uTime * 0.003, 0.0));
    d = remap(d, det * uN.z * smoothstep(0.0, 0.15, y), 1.0, 0.0, 1.0);
  }
  return sat(d) * uL.w;
}

/* 1 stratus: one even, low, featureless layer */
float dSt(vec3 p, float h, bool hi) {
  vec3 w = p + uWind;
  float n = pwN(vec3(w.x, 0.21 + uTime * 0.0004, w.z) / uN.x);
  float h0 = uL.x + (0.5 - n) * 0.08;
  float h1 = uL.y + (n - 0.5) * 0.1;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  float g = smoothstep(0.0, 0.3, hf) * smoothstep(1.0, 0.55, hf);
  float cov = uL.z * uForm;
  float d = g * sat(cov * 1.6 - (1.0 - n) * 0.8) * (0.75 + 0.25 * n);
  if (hi) d -= dtN(vec3(w.x, h * 2.0, w.z) / uN.y) * uN.z * g;
  return sat(d) * uL.w;
}

/* 2 cirrus: ice strands drawn out by the wind, in tufts and bands */
float dCi(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  vec3 w = p + uWind;
  vec2 r = rot(w.xz, uX.x);
  float wx = texture(uShape, vec3(r.x / 70.0, 0.11, r.y / 70.0)).g - 0.5;
  float wy = texture(uShape, vec3(r.x / 70.0 + 0.37, 0.71, r.y / 70.0)).g - 0.5;
  r += vec2(wx, wy) * 14.0;
  r.x += (1.0 - hf) * uX.y;
  float m = texture(uShape, vec3(r.x / 70.0, 0.55, r.y / 30.0)).r;
  float cov = uL.z * uForm;
  m = smoothstep(1.0 - cov, 1.0 - cov + 0.28, m);
  if (m <= 0.0) return 0.0;
  float s = texture(uShape, vec3(r.x / uN.x, h / 3.0, r.y / 0.75)).r;
  float d = sat((s - 0.5) * 2.4) * m;
  if (hi) {
    float f = texture(uDetail, vec3(r.x / 7.0, h / 1.4, r.y / uN.y)).r;
    d *= mix(0.25, 1.35, f);
  }
  float g = smoothstep(0.0, 0.4, hf) * smoothstep(1.0, 0.7, hf);
  return sat(d * g) * uL.w;
}

/* 3 stratocumulus: a low layer broken into lumps and rolls */
float dSc(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  vec3 w = p + uWind;
  vec2 r = rot(w.xz, 0.6);
  float cells = sat((texture(uShape, vec3(r.x / (uN.w * 1.5), 0.83, r.y / uN.w)).g - 0.28) / 0.40);
  float cov = uL.z * mix(0.4, 1.0, uForm);
  float c = sat((cells - (1.0 - cov)) / max(cov, 0.01));
  if (c <= 0.0) return 0.0;
  float dome = c - pow(hf, 1.3) * 0.9;
  if (dome <= 0.0) return 0.0;
  float b = pwN(vec3(w.x, h * 1.5 + uTime * 0.0008, w.z) / uN.x);
  float d = remap(dome * 2.5 * smoothstep(0.0, 0.1, hf), (1.0 - b) * 0.7, 1.0, 0.0, 1.0);
  if (d <= 0.0) return 0.0;
  if (hi) d = remap(d, dtN(vec3(w.x, h, w.z) / uN.y) * uN.z, 1.0, 0.0, 1.0);
  return sat(d) * uL.w;
}

/* 4 altocumulus: a thin middle layer of lumps, often in rows */
float dAc(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  vec3 w = p + uWind;
  vec2 r = rot(w.xz, uX.x);
  float rows = 0.5 + 0.5 * sin(r.y * 6.2831853 / uX.y + 1.6 * sin(r.x * 0.19));
  float patchy = texture(uShape, vec3(w.x / 24.0, 0.27, w.z / 24.0)).g;
  float cov = uL.z * mix(0.35, 1.0, uForm) * mix(0.72, 1.12, rows) * mix(0.7, 1.15, smoothstep(0.3, 0.8, patchy));
  float g = smoothstep(0.0, 0.3, hf) * smoothstep(1.0, 0.55, hf);
  float b = pwN(vec3(w.x, h * 1.5, w.z) / uN.x);
  float d = remap(b * g, 1.0 - cov, 1.0, 0.0, 1.0);
  if (d <= 0.0) return 0.0;
  if (hi) d = remap(d, dtN(vec3(w.x, h, w.z) / uN.y) * uN.z, 1.0, 0.0, 1.0);
  return sat(d) * uL.w;
}

/* 5 cirrocumulus: tiny high grains, in ripples and patches */
float dCc(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  vec3 w = p + uWind;
  vec2 r = rot(w.xz, uX.x);
  float rows = 0.5 + 0.5 * sin(r.y * 6.2831853 / uX.y + 2.2 * sin(r.x * 0.5));
  float patchy = texture(uShape, vec3(w.x / 28.0, 0.62, w.z / 16.0)).r;
  float cells = sat((texture(uShape, vec3(r.x / uN.w, h * 0.5, r.y / uN.w)).g - 0.40) / 0.29);
  float cov = uL.z * uForm * mix(0.7, 1.15, rows) * smoothstep(0.35, 0.6, patchy);
  float c = sat((cells - (1.0 - cov)) / max(cov, 0.01));
  float g = smoothstep(0.0, 0.3, hf) * (1.0 - smoothstep(0.4 + 0.5 * c, 1.0, hf));
  float d = c * g;
  if (d <= 0.0) return 0.0;
  if (hi) d = remap(d, dtN(vec3(w.x, h, w.z) / uN.y) * uN.z, 1.0, 0.0, 1.0);
  return sat(d * 1.5) * uL.w;
}

/* 6 altostratus: a uniform grey sheet with faint streaks */
float dAs(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  vec3 w = p + uWind;
  float n = pwN(vec3(w.x / uN.x, h / 4.0, w.z / (uN.x * 0.6)));
  float g = smoothstep(0.0, 0.25, hf) * smoothstep(1.0, 0.7, hf);
  float cov = uL.z * uForm;
  float d = g * sat(0.6 + (n - 0.5) * 0.8) * sat(cov * 1.4 - (1.0 - n) * 0.4);
  if (hi) d *= mix(0.82, 1.12, dtN(vec3(w.x / 6.0, h / 1.0, w.z / 1.1)));
  return sat(d) * uL.w;
}

/* 7 cirrostratus: a thin, faintly fibrous veil of ice */
float dCs(vec3 p, float h, bool hi) {
  float h0 = uL.x, h1 = uL.y;
  if (h < h0 || h > h1) return 0.0;
  float hf = (h - h0) / (h1 - h0);
  vec3 w = p + uWind;
  vec2 r = rot(w.xz, uX.x);
  float n = texture(uShape, vec3(r.x / uN.x, h / 5.0, r.y / (uN.x * 0.25))).r;
  float g = smoothstep(0.0, 0.3, hf) * smoothstep(1.0, 0.6, hf);
  float d = g * mix(0.55, 1.05, n) * sat(uL.z * uForm * 1.3 - (1.0 - n) * 0.3);
  if (hi) d *= mix(0.75, 1.2, texture(uDetail, vec3(r.x / 4.0, h, r.y / uN.y)).r);
  return sat(d) * uL.w;
}

/* 8 nimbostratus: a thick dark layer, ragged scraps beneath, rain */
float dNs(vec3 p, float h, bool hi) {
  vec3 w = p + uWind;
  float n = pwN(vec3(w.x, 0.5 + uTime * 0.0008, w.z) / uN.x);
  float base = uL.x + (0.5 - n) * 0.3;
  float d = 0.0;
  if (h >= base && h <= uL.y) {
    float hf = (h - base) / (uL.y - base);
    d = smoothstep(0.0, 0.05, hf) * (0.8 + 0.4 * (n - 0.5)) * uForm;
    if (hi) d -= dtN(vec3(w.x, h, w.z) / uN.y) * uN.z * (1.0 - smoothstep(0.0, 0.15, hf));
  }
  if (h > uX.x && h < base) {
    float hp = (h - uX.x) / (base - uX.x);
    float s = pwN(vec3(w.x, h * 2.0, w.z) / (uN.x * 0.32));
    float pd = remap(s * smoothstep(0.0, 0.35, hp) * smoothstep(1.0, 0.55, hp), 1.0 - uX.y * uForm, 1.0, 0.0, 1.0);
    d = max(d, sat(pd) * 0.7);
  }
  if (h < base && uX.z > 0.0) {
    float c = texture(uShape, vec3(w.x / 9.0, 0.6, w.z / 9.0)).g;
    float streak = texture(uDetail, vec3(w.x / 0.7, h / 5.0 + uTime * 0.02, w.z / 0.7)).r;
    float rain = uX.z * smoothstep(0.3, 0.75, c) * mix(0.5, 1.0, streak) * uForm;
    d = max(d, rain);
  }
  return sat(d) * uL.w;
}

/* 9 cumulonimbus: one storm tower, its anvil sheared downwind, rain beneath */
float dCb(vec3 p, float h, bool hi) {
  float base = uL.x, top = uL.y;
  float grow = uForm;
  float topNow = mix(base + 1.8, top, smoothstep(0.0, 0.8, grow));
  if (h > top + 1.0) return 0.0;
  vec2 rel = p.xz - uX.xy;
  float hf = sat((h - base) / (top - base));
  float d = 0.0;
  if (h >= base && h <= topNow + 0.5) {
    vec2 c = rel - vec2(uN.w * 0.12 * hf * hf, 0.0);
    float rT = uX.z * mix(1.15, 0.78, sqrt(hf)) * (1.0 + 1.1 * smoothstep(0.72, 1.0, hf));
    float bil = pwN(vec3(p.x, h * 0.6 - uTime * 0.0007, p.z) / uN.x);
    float tower = (rT + (bil - 0.5) * 3.4 - length(c)) / 1.1;
    d = sat(tower) * smoothstep(base, base + 0.05, h) * (1.0 - smoothstep(topNow - 1.6, topNow + 0.2, h));
  }
  float aGrow = smoothstep(0.65, 1.0, grow);
  if (aGrow > 0.0 && h > top - 3.2) {
    vec2 ra = rel - vec2(uX.w * 0.45 * aGrow, 0.0);
    float fib = texture(uShape, vec3(ra.x / 24.0, h / 2.5, ra.y / 7.0)).r;
    float e = length(ra / vec2(uX.w * mix(0.25, 1.0, aGrow), uX.w * mix(0.25, 0.6, aGrow))) + (fib - 0.5) * 0.3;
    float bottom = top - 3.2 * mix(0.3, 1.0, smoothstep(1.0, 0.05, e));
    float inA = smoothstep(bottom - 0.2, bottom + 0.35, h) * (1.0 - smoothstep(top - 0.25, top + 0.15, h));
    float anvil = sat((1.0 - e) * 2.2) * inA * mix(0.6, 1.0, fib);
    float dome = sat((2.2 - length(rel - vec2(0.8, 0.0)) - max(h - top, 0.0) * 1.8) / 0.9) * step(top - 0.8, h) * aGrow;
    d = max(d, max(anvil, dome));
  }
  if (hi && d > 0.0) d = remap(d, dtN(vec3(p.x, h, p.z) / uN.y) * uN.z, 1.0, 0.0, 1.0);
  if (h < base) {
    float rr = length(rel - vec2(1.4, 0.6));
    float shaft = smoothstep(uX.z * 0.85, uX.z * 0.25, rr) * 0.035 * grow;
    float streak = texture(uDetail, vec3(p.x / 0.55, h / 4.0 + uTime * 0.03, p.z / 0.55)).r;
    d = max(d, shaft * mix(0.45, 1.0, streak));
  }
  return sat(d) * uL.w;
}

float cloudDensity(vec3 p, bool hi) {
  float h = alt(p);
  if (uType == 0) return dHeaps(p, h, hi);
  if (uType == 3) return dSc(p, h, hi);
  if (uType == 1) return dSt(p, h, hi);
  if (uType == 2) return dCi(p, h, hi);
  if (uType == 4) return dAc(p, h, hi);
  if (uType == 5) return dCc(p, h, hi);
  if (uType == 6) return dAs(p, h, hi);
  if (uType == 7) return dCs(p, h, hi);
  if (uType == 8) return dNs(p, h, hi);
  if (uType == 9) return dCb(p, h, hi);
  return 0.0;
}
bool stormBox(vec3 ro, vec3 rd, out float t0, out float t1) {
  vec3 bmin = vec3(uX.x - uX.z - 7.0, 0.0, uX.y - uX.w * 0.7 - 2.0);
  vec3 bmax = vec3(uX.x + uX.w * 1.5 + 2.0, uL.y + 1.0, uX.y + uX.w * 0.7 + 2.0);
  vec3 sd = sign(rd) + vec3(equal(rd, vec3(0.0)));
  vec3 inv = 1.0 / (rd + sd * 1e-6);
  vec3 ta = (bmin - ro) * inv, tb = (bmax - ro) * inv;
  vec3 lo = min(ta, tb), hi = max(ta, tb);
  t0 = max(max(lo.x, lo.y), max(lo.z, 0.0));
  t1 = min(min(hi.x, hi.y), hi.z);
  return t1 > t0;
}`;

const SKY_GLSL = /* glsl */`
uniform vec3 uZenith;
uniform vec3 uHorizon;
uniform vec3 uHaze;
uniform vec3 uSunCol;
vec3 skyRadiance(vec3 rd, vec3 sunDir) {
  float y = max(rd.y, 0.0);
  float mu = dot(rd, sunDir);
  vec3 col = mix(uHorizon, uZenith, 1.0 - exp(-y * 5.5));
  col = mix(col, uHaze, exp(-y * 28.0) * 0.7);
  float m = clamp(mu, 0.0, 1.0);
  col += uSunCol * (0.012 * pow(m, 3.0) + 0.045 * pow(m, 16.0) + 0.16 * pow(m, 180.0));
  return col;
}`;

const FINAL_GLSL = /* glsl */`
uniform float uExposure;
uniform vec2 uRes;
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 toSRGB(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
vec3 finalize(vec3 c, vec2 fc) {
  c = aces(c * uExposure);
  vec2 uv = fc / uRes;
  float v = smoothstep(1.3, 0.38, length((uv - 0.5) * vec2(1.0, 0.85)));
  c *= mix(0.84, 1.0, v);
  c = toSRGB(c);
  return c + (hash12(fc) - 0.5) * (1.6 / 255.0);
}`;

const ACCUM_FRAG = /* glsl */`

  r += texture(uSky, vec2(t3.x, t0.y)).rgb * w3.x * w0.y;
  r += texture(uSky, vec2(t0.x, t12.y)).rgb * w0.x * w12.y;
  r += texture(uSky, vec2(t12.x, t12.y)).rgb * w12.x * w12.y;
  r += texture(uSky, vec2(t3.x, t12.y)).rgb * w3.x * w12.y;
  r += texture(uSky, vec2(t0.x, t3.y)).rgb * w0.x * w3.y;
  r += texture(uSky, vec2(t12.x, t3.y)).rgb * w12.x * w3.y;

  vec3 b = texelFetch(uSky, clamp(ip + ivec2(1, 0), ivec2(0), sz), 0).rgb;
  vec3 c = texelFetch(uSky, clamp(ip + ivec2(0, 1), ivec2(0), sz), 0).rgb;
  vec3 d = texelFetch(uSky, clamp(ip + ivec2(1, 1), ivec2(0), sz), 0).rgb;

/* ==========================================================================
   Page logic
   ========================================================================== */
const masthead = document.querySelector('.masthead');
const wordmark = document.querySelector('.wordmark');
const body = document.querySelector('.panel__body');
const gauge = document.querySelector('.gauge');
const spanEl = document.querySelector('.gauge__span');
const levelEls = [...document.querySelectorAll('.gauge__label')];
const backBtn = document.querySelector('.back');
const nextBtn = document.querySelector('.next');
const countEl = document.querySelector('.count');
const panel = document.querySelector('.panel');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const SHOT = params.has('shot');
const OGUI = params.has('ogui');
if (SHOT) document.documentElement.classList.add('shot');
if (params.has('noui')) document.documentElement.classList.add('noui');
if (OGUI) document.documentElement.classList.add('ogui');

let index = 0;
const indexOf = id => Math.max(0, STEPS.findIndex(s => s.id === id));
const hashId = () => decodeURIComponent(location.hash.slice(1));
if (hashId()) index = indexOf(hashId());

const GRID = [['high', 'cirrocumulus', 'cirrostratus', 'cirrus'], ['middle', 'altocumulus', 'altostratus', ''],
  ['low', 'cumulus', 'stratus', ''], ['', 'stratocumulus', '', ''], ['rain', 'cumulonimbus', 'nimbostratus', '']];
function cardHTML(step) {
  if (step.id === 'start') return `<p class="lead">${step.lead}</p>`;
  if (step.id === 'names') {
    const rows = GRID.map(r => `<tr><th scope="row">${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
    return `<h2 class="heading">${step.heading}</h2>
      <p class="look">${step.caption}</p>
      <table class="sr-only"><thead><tr><td></td><th scope="col">heaps</th><th scope="col">layers</th><th scope="col">strands</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  return `<h2 class="name">${step.name}<abbr title="The abbreviation weather observers use">${step.abbr}</abbr></h2>
    <p class="root">${step.root}</p>
    <p class="level">${step.level}</p>
    <p class="look">${step.look}</p>
    <p class="tell">${step.tell}</p>`;
}
/* The shade under the caption grows with the caption, so its text always sits on the darkened turf. */
const panelEl = document.querySelector('.panel');
if (panelEl && 'ResizeObserver' in window) new ResizeObserver(() => document.documentElement.style.setProperty('--panel-h', `${Math.ceil(panelEl.getBoundingClientRect().height)}px`)).observe(panelEl);
function renderCard(instant) {
  const step = STEPS[index];
  const gone = index > 0 && !OGUI;
  masthead.classList.toggle('is-gone', gone);
  wordmark.tabIndex = gone ? -1 : 0;
  const apply = () => {
    body.innerHTML = cardHTML(step);
    const n = LESSONS.indexOf(step);
    countEl.textContent = n >= 0 ? `${n + 1} of ${LESSONS.length}` : '';
    backBtn.hidden = index === 0;
    const next = STEPS[index + 1];
    nextBtn.textContent = index === 0 ? `Start with ${LESSONS[0].name.toLowerCase()}` : !next ? 'Start again' : next.name ? `Next: ${next.name}` : 'Next: all ten names';
    panel.classList.toggle('no-gauge', !step.span);
    if (step.span) {
      const pct = km => Math.min(km, 13) / 13 * 100;
      spanEl.style.bottom = `${pct(step.span[0])}%`;
      spanEl.style.height = `${pct(step.span[1]) - pct(step.span[0])}%`;
      levelEls.forEach(el => el.classList.toggle('is-on', el.dataset.level === step.band));
      gauge.classList.remove('is-hidden');
    } else gauge.classList.add('is-hidden');
    body.classList.remove('is-fading');
  };
  if (instant || reduceMotion) apply();
  else { body.classList.add('is-fading'); setTimeout(apply, 320); }
}
function go(i, fromHash) {
  index = (i + STEPS.length) % STEPS.length;
  if (!fromHash) history.replaceState(null, '', index === 0 ? location.pathname + location.search : `#${STEPS[index].id}`);
  renderCard(false);
  sky?.setScene(STEPS[index].scene);
  sky?.setLetters(STEPS[index]);
}
nextBtn.addEventListener('click', () => go(index + 1));
backBtn.addEventListener('click', () => go(index - 1));
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') go(index + 1);
  else if (e.key === 'ArrowLeft' && index > 0) go(index - 1);
});
addEventListener('hashchange', () => { const i = indexOf(hashId()); if (i !== index) go(i, true); });

/* Swipe: on a touch screen, swipe left for the next cloud and right for the one before, like the arrow keys.
   A swipe that starts at the screen's edge is left to the browser's own back gesture; a second finger cancels it. */
let swipe = null;
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  swipe = e.isPrimary && e.clientX > 20 && e.clientX < innerWidth - 20 ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp } : null;
});
addEventListener('pointerup', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, quick = e.timeStamp - swipe.t < 900;
  swipe = null;
  if (!quick || Math.abs(dx) < Math.max(40, innerWidth * 0.1) || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
  if (dx < 0) go(index + 1);
  else if (index > 0) go(index - 1);
});
addEventListener('pointercancel', () => { swipe = null; });
renderCard(true);

let sky = null;

catch (err) { console.error(err); document.documentElement.classList.add('no-webgl'); }

function createSky() {

  renderer.setPixelRatio(dpr());

    mesh.frustumCulled = false;

    for (let z = 0; z < size; z++) { p.material.uniforms.uSlice.value = (z + 0.5) / size; p.render(rt, z); }
    p.material.dispose();

  const shapeSize = Number(params.get('noise')) || (small ? 96 : TUNE.shapeSize);
  const shapeTex = volume(shapeSize, 0);
  const detailTex = volume(TUNE.detailSize, 1);

  /* Shared uniforms: one object per name, shared by every material. */
  const v3 = a => new THREE.Vector3(...a);

    uShape: { value: shapeTex }, uDetail: { value: detailTex },
    uType: { value: -1 }, uForm: { value: 0 }, uWind: { value: new THREE.Vector3() }, uTime: { value: 0 },
    uL: { value: new THREE.Vector4() }, uN: { value: new THREE.Vector4() }, uX: { value: new THREE.Vector4() },

/* The land: you stand on a low knoll of turf. Below it a plain of fields and hedges runs out to three

function terrain(x, z) {
