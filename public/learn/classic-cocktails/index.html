<style>
:root { --ivory:#ece3cd; --dim:#a99f88; --brass:#c9a45c; --brass-hi:#f0d9a0; --baize:#183a2d; --night:#0c0806;
  --serif:"Young Serif", Georgia, "Times New Roman", serif; --sans:Jost, Futura, "Century Gothic", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*, *::before, *::after { box-sizing:inherit; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--night); color:var(--ivory); font-family:var(--sans); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
#scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
.sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.fade { opacity:0; visibility:hidden; transition:opacity .55s ease, visibility 0s linear .55s; }
.fade.is-on { opacity:1; visibility:visible; transition:opacity .55s ease; }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:2px solid var(--brass-hi); outline-offset:3px; }

#loading { position:fixed; inset:0; display:grid; place-content:center; justify-items:center; gap:14px; background:var(--night); transition:opacity 1.1s ease; z-index:20; }

#loading p { margin:0; font:300 15px/1.5 var(--sans); color:var(--dim); max-width:30ch; text-align:center; }
#loading svg { width:34px; height:34px; animation:turn 2.6s linear infinite; }
@keyframes turn { to { transform:rotate(60deg); } }

.chip { position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); z-index:6; display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px 8px 12px; border:1px solid rgba(201,164,92,.5); border-radius:2px; background:rgba(14,10,7,.5);
  font:400 14px/1 var(--sans); letter-spacing:.02em; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.chip:hover { border-color:var(--brass); }
.chip svg { width:15px; height:15px; flex:none; }
#btn-menu { left:calc(env(safe-area-inset-left,0px) + 18px); }

#panel { position:fixed; z-index:4; left:max(4vw, 28px); top:15vh; width:min(27vw, 330px); pointer-events:none; text-shadow:0 1px 14px rgba(0,0,0,.6); }
#d-name { margin:0 0 10px; font:400 clamp(30px, 3.1vw, 46px)/1.04 var(--serif); letter-spacing:-.005em; color:var(--ivory); }
#d-serve { margin:0 0 26px; font:300 15px/1.45 var(--sans); color:var(--dim); max-width:28ch; }
#d-steps { list-style:none; margin:0; padding:0; display:grid; gap:9px; }
#d-steps li { display:grid; grid-template-columns:26px 1fr; align-items:baseline; font:300 15px/1.38 var(--sans); color:rgba(236,227,205,.42); transition:color .4s; }
#d-steps .st-n { font:400 12px/1 var(--sans); color:rgba(201,164,92,.5); font-variant-numeric:tabular-nums; }
#d-steps li.is-done { color:rgba(236,227,205,.62); }
#d-steps li.is-now { color:var(--ivory); }
#d-steps li.is-now .st-n { color:var(--brass-hi); }
#d-steps li.is-now .st-t { box-shadow:inset 0 -1px 0 rgba(201,164,92,.6); }

#leaders { position:fixed; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:visible; transition:opacity .6s; }
#leaders path { fill:none; stroke:rgba(236,227,205,.5); stroke-width:1; transition:opacity .5s; }
#leaders circle { fill:var(--ivory); transition:opacity .5s; }
#callouts { position:fixed; inset:0; z-index:3; pointer-events:none; --pp:24px; --barw:96px; }
.co { position:absolute; left:0; top:0; display:grid; grid-template-columns:calc(var(--barw) + 10px) auto auto auto; align-items:center; column-gap:6px;
  white-space:nowrap; opacity:0; transition:opacity .5s ease; text-shadow:0 0 2px rgba(0,0,0,.95), 0 1px 8px rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.6); will-change:transform; }
.co.is-in { opacity:1; }
#callouts.is-out .co { opacity:0; }
.co-bar { position:relative; height:8px; display:inline-flex; gap:5px; align-items:center; }
.co-pour .co-bar { border:1px solid rgba(236,227,205,.42); }

.co-pour .co-bar::after { content:""; position:absolute; inset:-1px; background:repeating-linear-gradient(90deg, transparent 0 calc(var(--tk) - 1px), rgba(236,227,205,.5) calc(var(--tk) - 1px) var(--tk)); }
.co-bar b { width:7px; height:7px; border-radius:50%; border:1px solid var(--c); }
.co-bar b.on { background:var(--c); }
.co-n { font:400 19px/1 var(--serif); color:var(--ivory); font-variant-numeric:tabular-nums; }
.co-u { font:300 13px/1 var(--sans); color:var(--dim); }
.co-name { font:400 14px/1 var(--sans); color:var(--ivory); padding-left:2px; }

#caption { position:fixed; z-index:4; left:20px; right:20px; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); margin:0; display:none; pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.7); }
#cap-step { display:block; font:400 12px/1 var(--sans); letter-spacing:.04em; color:var(--brass); margin-bottom:7px; font-variant-numeric:tabular-nums; }

#finale { position:fixed; z-index:5; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:min(760px, calc(100vw - 24px)); max-height:min(34vh, 300px); overflow:auto;

.f-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:10px; }

#f-again { background:var(--brass); color:#1a120b; border:1px solid var(--brass); }
#f-again:hover { background:var(--brass-hi); }
#f-back { background:transparent; color:var(--ivory); border:1px solid rgba(201,164,92,.6); }
#f-back:hover { border-color:var(--brass-hi); }
.f-spec { display:grid; grid-template-columns:1fr 1fr; column-gap:28px; margin:0 0 10px; }
.f-row { display:grid; grid-template-columns:72px 1fr auto; column-gap:10px; align-items:baseline; padding:5px 0; border-top:1px solid rgba(201,164,92,.2); font:300 14px/1.3 var(--sans); }
.f-row span:first-child { font:400 14px/1.3 var(--serif); color:var(--brass-hi); white-space:nowrap; }
.f-row span:last-child { color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
#f-method { margin:0; font:300 14px/1.45 var(--sans); color:rgba(236,227,205,.86); }
#f-taste { margin:-4px 0 10px; font:italic 300 14px/1.35 var(--sans); color:rgba(236,227,205,.66); }
#f-more { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin-top:10px; padding-top:9px; border-top:1px solid rgba(201,164,92,.2); font:300 13px/1.3 var(--sans); color:var(--dim); }
.f-link { appearance:none; background:none; border:0; padding:2px 0; font:400 14px/1.2 var(--serif); color:var(--brass-hi); cursor:pointer; border-bottom:1px solid rgba(201,164,92,.45); }
.f-link:hover, .f-link:focus-visible { color:var(--ivory); border-bottom-color:var(--ivory); outline:none; }
.co.is-pending .co-n, .co.is-pending .co-u { opacity:.42; }


@media (max-aspect-ratio: 9/10) {
  #panel { left:20px; right:20px; width:auto; top:calc(env(safe-area-inset-top,0px) + 66px); }
  #d-name { font-size:31px; margin-bottom:6px; }
  #d-serve { font-size:14px; margin:0; }
  #d-steps { display:none; }
  #caption { display:block; }
  .co { grid-template-columns:calc(var(--barw) + 8px) auto auto; grid-template-rows:auto auto; row-gap:4px; column-gap:4px; }
  .co-name { grid-column:1 / -1; font-size:13px; padding-left:0; color:rgba(236,227,205,.85); }
  .co-n { font-size:16px; } .co-u { font-size:11px; }
  #finale { width:calc(100vw - 20px); max-height:40vh; padding:12px 16px; }
  .f-head { margin-bottom:6px; }
  .f-row { padding:4px 0; font-size:13px; grid-template-columns:64px 1fr auto; }
  .f-row span:first-child { font-size:13px; }
  #f-method { font-size:13px; line-height:1.4; }
  #f-taste { font-size:13px; margin-bottom:8px; }
  #f-more { margin-top:8px; padding-top:7px; }
  .f-spec { grid-template-columns:1fr; }
  #f-name { font-size:23px; }
}
@media (prefers-reduced-motion: reduce) { .fade, #finale, .co { transition-duration:.01s !important; } #loading svg { animation:none; } }
#vinyl { --d:33px; position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:calc(env(safe-area-inset-left,0px) + 112px); z-index:6; width:var(--d); height:var(--d); border-radius:50%;
  border:1px solid rgba(201,164,92,.5); background:rgba(14,10,7,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-sizing:border-box; padding:2px; display:block; transition:border-color .3s, box-shadow .3s, opacity .6s; }
#vinyl:hover, #vinyl:focus-visible { border-color:var(--brass); box-shadow:0 0 14px rgba(201,164,92,.22); outline:none; }
.vinyl-disc { display:block; width:100%; height:100%; border-radius:50%; overflow:hidden; animation:vspin 6s linear infinite; }
.vinyl-disc svg { display:block; width:100%; height:100%; }
.vinyl-sheen { position:absolute; inset:2px; border-radius:50%; pointer-events:none; background:conic-gradient(from 18deg, transparent 0 6%, rgba(240,217,160,.2) 11%, transparent 17% 51%, rgba(240,217,160,.12) 61%, transparent 67%);
  -webkit-mask:radial-gradient(circle, transparent 0 39%, #000 41% 96%, transparent 98%); mask:radial-gradient(circle, transparent 0 39%, #000 41% 96%, transparent 98%); }
.vinyl-tip { position:absolute; left:calc(100% + 10px); top:50%; white-space:nowrap; padding:7px 11px 8px; font:400 12px/1 var(--sans); letter-spacing:.03em; color:var(--ivory); background:rgba(14,10,7,.62);
  border:1px solid rgba(201,164,92,.45); border-radius:2px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); opacity:0; transform:translate(-6px, -50%); transition:opacity .3s, transform .3s; pointer-events:none; }
#vinyl:hover .vinyl-tip, #vinyl:focus-visible .vinyl-tip { opacity:1; transform:translate(0, -50%); }
@media (hover: none) { .vinyl-tip { display:none; } }
@keyframes vspin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .vinyl-disc { animation:none; } }

<script>
(() => {
/* The Gold Room: classic cocktails, poured by the part. */
'use strict';
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const E = {
  inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  out5: t => 1 - Math.pow(1 - t, 5),
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  in2: t => t * t,
  out2: t => 1 - (1 - t) * (1 - t),
  outBack: t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(19801980);
const rr = (a, b) => a + (b - a) * rand();
const noop = () => {};
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u) * 2 - 1; }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7 + 1.7) * 43758.5453; return s - Math.floor(s); }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * noise2(x * f + i * 17.3, y * f + i * 9.1); n += a; f *= 2.03; a *= 0.5; }
  return s / n;
}
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
const s2l = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
const linHex = h => hexRGB(h).map(s2l);
const vec3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const v3hex = h => { const c = linHex(h); return new THREE.Vector3(c[0], c[1], c[2]); };
const FRAC = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
function fmtParts(p) {
  const w = Math.floor(p + 1e-6); const f = Math.round((p - w) * 4) / 4; const fs = FRAC[f] || '';

const partWord = p => (p > 1.001 ? 'parts' : 'part');
const fmtNum = v => (Math.abs(v - Math.round(v)) < 0.01 ? String(Math.round(v)) : v.toFixed(1));
const fmtMl = p => { const ml = p * 30; return (Math.abs(ml - Math.round(ml)) < 0.01 ? Math.round(ml) : ml.toFixed(1)) + ' ml'; };

class Spring {
  constructor(x = 0, w = 10, z = 0.85) { this.x = x; this.v = 0; this.t = x; this.w = w; this.z = z; }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt * 300)), h = dt / n, w = this.w, z = this.z;
    for (let i = 0; i < n; i++) { this.v += (w * w * (this.t - this.x) - 2 * z * w * this.v) * h; this.x += this.v * h; }
    return this.x;
  }
  snap(x) { this.x = this.t = x; this.v = 0; }
}
class Spring3 {
  constructor(p, w = 10, z = 0.85) { this.x = p.clone(); this.v = vec3(); this.t = p.clone(); this.w = w; this.z = z; }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt * 300)), h = dt / n, w = this.w, z = this.z, X = this.x, V = this.v, T = this.t, k = w * w, c = 2 * z * w;
    for (let i = 0; i < n; i++) {

      X.x += V.x * h; X.y += V.y * h; X.z += V.z * h;
    }
  }
  snap(p) { this.x.copy(p); this.t.copy(p); this.v.set(0, 0, 0); }

/* A frame-driven task runner. Every awaited animation belongs to a generation;

  constructor() { this.tasks = []; this.gen = 0; }
  update(dt) {
    const list = this.tasks; this.tasks = [];
    for (const t of list) { let done = true; try { done = t(dt); } catch (e) { console.error(e); } if (!done) this.tasks.push(t); }
  }

    const gen = this.gen;
    return new Promise((resolve, reject) => {
      if (dur <= 0) { fn(1, 1); resolve(); return; }
